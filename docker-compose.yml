services:
  backend:
    build: ./backend
    container_name: synth-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=INFO
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL:-}
      - AI_GATEWAY_TOKEN=${AI_GATEWAY_TOKEN:-}
      - AI_MODEL=${AI_MODEL:-claude-opus-4-6}
      - AI_API_FORMAT=${AI_API_FORMAT:-openai}
      - AI_TIMEOUT=${AI_TIMEOUT:-30}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
    volumes:
      - export-data:/tmp/exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: synth-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  export-data:
